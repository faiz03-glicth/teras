# Home → tap today on the wave → Day sheet → open a workout → Session → an exercise's heading →
# Exercise detail. Read-only.
appId: com.faiz.teras.local
---
- runFlow: ../subflows/open-app.yaml
- assertVisible: { id: 'training-wave' }
- tapOn: '.*, today: .*'
- assertVisible: { id: 'day-sheet' }
- assertVisible: { id: 'day-level' }
- tapOn: { id: 'day-workout-.*', index: 0, optional: true }
- assertVisible: { id: 'session-screen', optional: true }
- back
- tapOn: { id: 'feed-.*', index: 0 }
- assertVisible: { id: 'session-screen' }
# A feed entry always has a completed set, so its first exercise is there to open.
- tapOn: { id: 'session-exercise-open-.*', index: 0 }
- assertVisible: { id: 'exercise-detail-screen' }
- back
- assertVisible: { id: 'session-screen' }
- back
