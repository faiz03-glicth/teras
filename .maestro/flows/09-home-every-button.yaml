# Home: every element and button (the wave (a heading only: the Calendar opens from Profile), day cells, feed entry → Session). Read-only.
appId: com.faiz.teras.local
---
- runFlow: ../subflows/open-app.yaml
- assertVisible: { id: 'home-screen' }
- assertVisible: { id: 'training-wave', optional: true }
- tapOn: { id: 'session-.*', optional: true }
- assertVisible: { id: 'session-screen', optional: true }
- tapOn: { id: 'session-exercise-open-.*', optional: true }
- assertVisible: { id: 'exercise-detail-screen', optional: true }
