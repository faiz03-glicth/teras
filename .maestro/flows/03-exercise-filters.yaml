# Exercise library: muscle filter (body map / chip) and equipment filter, combined. Read-only.
appId: com.faiz.teras.local
---
- runFlow: ../subflows/open-app.yaml
- tapOn: { id: "tab-workout" }
- tapOn:
    id: "workout-library"
- tapOn: "All muscles"
- tapOn: "Chest"
- assertVisible: "14 EXERCISES"
- tapOn: "All equipment"
- tapOn: "Dumbbell"
- assertVisible: "4 EXERCISES"
- assertVisible: "Chest Fly (Dumbbell)"
- back
