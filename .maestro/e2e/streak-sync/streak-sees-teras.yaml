# Read-only (Streak): the check-in the server made from the Teras workout on ${DAY} reaches Streak.
# A cold start runs Streak's sync, which brings it in.
appId: ${STREAK_APP}
---
# A cold start, then the link once Home is up: a link that arrives while Streak is starting is lost.
- launchApp:
    appId: ${STREAK_APP}
    stopApp: true
- extendedWaitUntil:
    visible: { id: 'home-screen' }
    timeout: 30000
- openLink: ${STREAK_SCHEME}://day/${DAY}
- extendedWaitUntil:
    visible: { id: 'day-sheet' }
    timeout: 20000
- scrollUntilVisible:
    element: 'Options for Workout at .*'
    direction: DOWN
    timeout: 45000
- assertVisible:
    id: 'teras-mark'
    optional: true
