# Read-only (Streak): the check-in the server made from the Teras workout on ${DAY} reaches Streak.
# Coming to the foreground starts Streak's sync, which brings it in.
appId: ${STREAK_APP}
---
- launchApp:
    appId: ${STREAK_APP}
    stopApp: false
- openLink: ${STREAK_SCHEME}://day/${DAY}
- extendedWaitUntil:
    visible: 'Options for Workout at .*'
    timeout: 45000
- assertVisible:
    id: 'teras-mark'
    optional: true
