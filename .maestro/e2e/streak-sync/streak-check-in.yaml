# WRITES DATA (Streak): checks in a Workout on ${DAY}. Run by run.mjs, which passes DAY, STREAK_APP and
# STREAK_SCHEME. Streak uploads 3 s after a change while it is in the foreground, so it is left open.
appId: ${STREAK_APP}
---
# A cold start, then the link once Home is up: a link that arrives while Streak is starting is lost.
- launchApp:
    appId: ${STREAK_APP}
    stopApp: true
- extendedWaitUntil:
    visible: { id: 'home-screen' }
    timeout: 30000
- openLink: ${STREAK_SCHEME}://day/${DAY}
- extendedWaitUntil:
    visible: { id: 'day-sheet' }
    timeout: 20000
- tapOn: { id: 'activity-workout' }
- tapOn: { id: 'day-check-in' }
# The timeline sits below the fold.
- scrollUntilVisible:
    element: 'Options for Workout at .*'
    direction: DOWN
    timeout: 15000
