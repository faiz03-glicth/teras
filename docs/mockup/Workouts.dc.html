<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workouts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F2F5F1;color:#101713}
a{color:#9A5205}a:hover{color:#7A4104}
input::placeholder{color:#646F67}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background-color: #F2F5F1; background-image: radial-gradient(110% 55% at 0% 0%, #F6E2C6 0%, rgba(246,226,198,0) 60%), radial-gradient(80% 45% at 100% 28%, #D8E8F4 0%, rgba(216,232,244,0) 62%), radial-gradient(100% 55% at 25% 100%, #EEE7D2 0%, rgba(238,231,210,0) 62%); font-family: Inter, system-ui, sans-serif; color: #101713">
<main style="padding: 58px 16px 0px; display: flex; flex-direction: column; gap: 14px">
<header>
<div style="font-size: 12px; line-height: 16px; font-weight: 500; color: #56625A">16 curated · 2 of yours</div>
<h1 style="margin: 0; font-size: 26px; line-height: 31px; font-weight: 700; letter-spacing: -0.5px">Workouts</h1>
</header>

<div style="display: flex; gap: 8px">
<label for="workout-search" style="flex-grow: 1; height: 48px; box-sizing: border-box; padding: 0px 14px; border-radius: 14px; background: rgba(255,255,255,0.82); box-shadow: inset 0px 0px 0px 1px #858F87; display: flex; align-items: center; gap: 8px; color: #646F67">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Search workouts</span>
<input id="workout-search" type="search" placeholder="Search workouts or exercises" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #101713">
</label>
<button type="button" aria-label="Filters and sort" style="width: 48px; height: 48px; border-radius: 14px; border: none; padding: 0; background: rgba(255,255,255,0.82); box-shadow: inset 0px 0px 0px 1px #858F87; color: #101713; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"></line><line x1="10" x2="3" y1="4" y2="4"></line><line x1="21" x2="12" y1="12" y2="12"></line><line x1="8" x2="3" y1="12" y2="12"></line><line x1="21" x2="16" y1="20" y2="20"></line><line x1="12" x2="3" y1="20" y2="20"></line><line x1="14" x2="14" y1="2" y2="6"></line><line x1="8" x2="8" y1="10" y2="14"></line><line x1="16" x2="16" y1="18" y2="22"></line></svg>
</button>
</div>

<div aria-label="Goal" style="display: flex; gap: 8px; overflow: hidden; margin-right: -16px">
<button type="button" aria-pressed="true" style="flex-shrink: 0; height: 44px; padding: 0px 16px 0px 12px; border-radius: 22px; border: none; background: #F6DEBE; color: #7A4104; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>All
</button>
<button type="button" aria-pressed="false" style="flex-shrink: 0; height: 44px; padding: 0px 16px; border-radius: 22px; border: none; background: rgba(255,255,255,0.62); box-shadow: inset 0px 0px 0px 1px #DCE2DB; color: #101713; font-family: inherit; font-size: 14px; font-weight: 500">Strength</button>
<button type="button" aria-pressed="false" style="flex-shrink: 0; height: 44px; padding: 0px 16px; border-radius: 22px; border: none; background: rgba(255,255,255,0.62); box-shadow: inset 0px 0px 0px 1px #DCE2DB; color: #101713; font-family: inherit; font-size: 14px; font-weight: 500">Muscle</button>
<button type="button" aria-pressed="false" style="flex-shrink: 0; height: 44px; padding: 0px 16px; border-radius: 22px; border: none; background: rgba(255,255,255,0.62); box-shadow: inset 0px 0px 0px 1px #DCE2DB; color: #101713; font-family: inherit; font-size: 14px; font-weight: 500">Endurance</button>
<button type="button" aria-pressed="false" style="flex-shrink: 0; height: 44px; padding: 0px 16px; border-radius: 22px; border: none; background: rgba(255,255,255,0.62); box-shadow: inset 0px 0px 0px 1px #DCE2DB; color: #101713; font-family: inherit; font-size: 14px; font-weight: 500">Mobility</button>
</div>

<section style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px">
<div style="display: flex; align-items: center">
<h2 style="margin: 0; flex-grow: 1; font-size: 16px; line-height: 21px; font-weight: 600">Your routines</h2>
<button type="button" style="height: 44px; padding: 0px 4px 0px 8px; border: none; background: transparent; color: #9A5205; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 4px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>New routine
</button>
</div>
<sc-for list="{{routines}}" as="w" hint-placeholder-count="2">
<article style="padding: 14px 14px 14px 16px; border-radius: 20px; background: rgba(255,255,255,0.62); box-shadow: inset 0px 1px 0px rgba(255,255,255,0.95), 0px 10px 30px -12px rgba(48,32,12,0.12); display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: flex-start; gap: 12px">
<a href="Preview.dc.html" style="flex-grow: 1; min-width: 0; min-height: 44px; text-decoration: none; color: #101713; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; line-height: 21px; font-weight: 600">{{w.name}}</span>
<span style="font-size: 13px; line-height: 18px; color: #56625A">{{w.muscles}}</span>
</a>
<a href="Active.dc.html" aria-label="{{w.startLabel}}" style="flex-shrink: 0; height: 44px; padding: 0px 16px; border-radius: 22px; background: #E08A1E; color: #1F1204; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 6px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>Start
</a>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13px; line-height: 18px; color: #56625A">
<span style="display: flex; align-items: center; gap: 5px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>{{w.minutes}}
</span>
<span style="display: flex; align-items: center; gap: 5px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h.01"></path><path d="M3 18h.01"></path><path d="M3 6h.01"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M8 6h13"></path></svg>{{w.count}}
</span>
<span style="display: flex; align-items: center; gap: 6px">
<span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 2px; height: 12px">
<sc-for list="{{w.bars}}" as="b" hint-placeholder-count="3">
<span style="width: 3px; height: {{b.h}}px; border-radius: 1px; background: {{b.bg}}"></span>
</sc-for>
</span>{{w.level}}
</span>
</div>
<div style="display: flex; align-items: center; gap: 5px; font-size: 13px; line-height: 18px; color: #56625A">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.4 14.4 9.6 9.6"></path><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"></path><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"></path></svg>{{w.equipment}}
</div>
</article>
</sc-for>
</section>

<section style="display: flex; flex-direction: column; gap: 10px; margin-top: 6px">
<div style="display: flex; align-items: baseline; gap: 8px">
<h2 style="margin: 0; font-size: 16px; line-height: 21px; font-weight: 600">Strength</h2>
<span style="font-size: 13px; line-height: 18px; color: #56625A">Curated · 4</span>
</div>
<sc-for list="{{strength}}" as="w" hint-placeholder-count="2">
<article style="padding: 14px 14px 14px 16px; border-radius: 20px; background: rgba(255,255,255,0.62); box-shadow: inset 0px 1px 0px rgba(255,255,255,0.95), 0px 10px 30px -12px rgba(48,32,12,0.12); display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: flex-start; gap: 12px">
<a href="Preview.dc.html" style="flex-grow: 1; min-width: 0; min-height: 44px; text-decoration: none; color: #101713; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; line-height: 21px; font-weight: 600">{{w.name}}</span>
<span style="font-size: 13px; line-height: 18px; color: #56625A">{{w.muscles}}</span>
</a>
<a href="Active.dc.html" aria-label="{{w.startLabel}}" style="flex-shrink: 0; height: 44px; padding: 0px 16px; border-radius: 22px; background: #E08A1E; color: #1F1204; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 6px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>Start
</a>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13px; line-height: 18px; color: #56625A">
<span style="display: flex; align-items: center; gap: 5px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>{{w.minutes}}
</span>
<span style="display: flex; align-items: center; gap: 5px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h.01"></path><path d="M3 18h.01"></path><path d="M3 6h.01"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M8 6h13"></path></svg>{{w.count}}
</span>
<span style="display: flex; align-items: center; gap: 6px">
<span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 2px; height: 12px">
<sc-for list="{{w.bars}}" as="b" hint-placeholder-count="3">
<span style="width: 3px; height: {{b.h}}px; border-radius: 1px; background: {{b.bg}}"></span>
</sc-for>
</span>{{w.level}}
</span>
</div>
<div style="display: flex; align-items: center; gap: 5px; font-size: 13px; line-height: 18px; color: #56625A">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.4 14.4 9.6 9.6"></path><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"></path><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"></path></svg>{{w.equipment}}
</div>
</article>
</sc-for>
</section>
</main>
<div style="position: absolute; left: 0px; bottom: 0px; width: 390px; height: 104px">
<dc-import name="TabBar" active="workouts" hint-size="390px,104px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const bars = (n) => [6, 9, 12].map((h, i) => ({ h: h, bg: i < n ? '#9A5205' : 'rgba(60,40,12,0.18)' }));
    const card = (name, muscles, minutes, count, level, n, equipment) => ({
      name: name,
      muscles: muscles,
      minutes: minutes,
      count: count,
      level: level,
      bars: bars(n),
      equipment: equipment,
      startLabel: 'Start ' + name,
    });
    return {
      routines: [
        card('Push Day', 'Chest · Shoulders · Triceps', '55 min', '6 exercises', 'Intermediate', 2, 'Barbell, Dumbbells, Cable'),
        card('Pull Day', 'Back · Biceps · Rear delts', '50 min', '6 exercises', 'Intermediate', 2, 'Barbell, Cable, Pull-up bar'),
      ],
      strength: [
        card('5×5 Strength A', 'Legs · Chest · Back', '45 min', '3 exercises', 'Beginner', 1, 'Barbell, Rack'),
        card('Upper Power', 'Chest · Back · Shoulders', '60 min', '5 exercises', 'Advanced', 3, 'Barbell, Dumbbells'),
      ],
    };
  }
}
</script>
</body>
</html>
