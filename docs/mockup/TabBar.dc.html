<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 104px; position: relative; font-family: Inter, system-ui, sans-serif; color: #2B1D0B">
<nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; top: 10px; height: 64px; box-sizing: border-box; padding: 0 6px; border-radius: 32px; background: rgba(255,246,214,0.94); box-shadow: inset 0px 1px 0px rgba(255,255,255,0.85), inset 0px 0px 0px 0.5px rgba(255,255,255,0.6), 0px 12px 30px -10px rgba(70,40,12,0.24); display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-current="{{home.current}}" style="width: 66px; height: 52px; border-radius: 26px; background: {{home.bg}}; color: {{home.fg}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
<span style="font-size: 11px; line-height: 14px; font-weight: {{home.weight}}">Home</span>
</a>
<a href="Workouts.dc.html" aria-current="{{workouts.current}}" style="width: 66px; height: 52px; border-radius: 26px; background: {{workouts.bg}}; color: {{workouts.fg}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.4 14.4 9.6 9.6"></path><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"></path><path d="m21.5 21.5-1.4-1.4"></path><path d="M3.9 3.9 2.5 2.5"></path><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"></path></svg>
<span style="font-size: 11px; line-height: 14px; font-weight: {{workouts.weight}}">Workouts</span>
</a>
<div style="position: relative; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center">
<sc-if value="{{running}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; top: -16px; left: 50%; transform: translateX(-50%); padding: 1px 8px; border-radius: 999px; background: #2B1D0B; color: #FFF4CF; font-size: 11px; line-height: 16px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap">24:13</span>
</sc-if>
<a href="Active.dc.html" aria-label="{{fabLabel}}" style="width: 56px; height: 56px; box-sizing: border-box; border-radius: 28px; border: 2px solid #6A522E; background: #FFD179; color: #2B1D0B; box-shadow: 0px 3px 0px #6A522E; text-decoration: none; display: flex; align-items: center; justify-content: center">
<sc-if value="{{idle}}" hint-placeholder-val="{{true}}">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
</sc-if>
<sc-if value="{{running}}" hint-placeholder-val="{{false}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
</sc-if>
</a>
</div>
<a href="Progress.dc.html" aria-current="{{progress.current}}" style="width: 66px; height: 52px; border-radius: 26px; background: {{progress.bg}}; color: {{progress.fg}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>
<span style="font-size: 11px; line-height: 14px; font-weight: {{progress.weight}}">Progress</span>
</a>
<a href="Main.dc.html" aria-current="{{profile.current}}" style="width: 66px; height: 52px; border-radius: 26px; background: {{profile.bg}}; color: {{profile.fg}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
<span style="font-size: 11px; line-height: 14px; font-weight: {{profile.weight}}">Profile</span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","workouts","progress","profile"],"default":"home"},"running":{"editor":"boolean","default":false},"$preview":{"width":390,"height":104}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const running = this.props.running ?? false;
    const tab = (id) => {
      const on = active === id;
      return {
        bg: on ? '#FFE2A0' : 'transparent',
        fg: on ? '#5C3A08' : '#614722',
        weight: on ? 600 : 500,
        current: on ? 'page' : 'false',
      };
    };
    return {
      home: tab('home'),
      workouts: tab('workouts'),
      progress: tab('progress'),
      profile: tab('profile'),
      running: running,
      idle: !running,
      fabLabel: running ? 'Resume workout, 24 minutes in' : 'Start an empty workout',
    };
  }
}
</script>
</body>
</html>
