<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Active workout, dark theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0D100E;color:#EDF2EE}
a{color:#FFC46B}a:hover{color:#FFD48F}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0D100E">
<dc-import name="Active" dark="{{yes}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true };
  }
}
</script>
</body>
</html>
