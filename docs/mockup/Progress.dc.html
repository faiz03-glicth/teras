<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progress</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F6E7B6;color:#2B1D0B}
a{color:#7A4A12}a:hover{color:#5C3A08}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background-color: #F6E7B6; background-image: radial-gradient(110% 55% at 0% 0%, #FFF1C2 0%, rgba(255,241,194,0) 60%), radial-gradient(80% 45% at 100% 28%, #F0DDA0 0%, rgba(240,221,160,0) 62%), radial-gradient(100% 55% at 25% 100%, #E9D39A 0%, rgba(233,211,154,0) 62%); font-family: Inter, system-ui, sans-serif; color: #2B1D0B">
<main style="padding: 58px 16px 0px; display: flex; flex-direction: column; gap: 16px">
<header>
<div style="font-size: 12px; line-height: 16px; font-weight: 500; color: #614722">41 sessions since July</div>
<h1 style="margin: 0; font-size: 26px; line-height: 31px; font-weight: 700; letter-spacing: -0.5px">Progress</h1>
</header>

<div role="tablist" aria-label="Progress view" style="height: 44px; box-sizing: border-box; padding: 3px; border-radius: 14px; background: rgba(97,71,34,0.07); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px">
<button type="button" role="tab" aria-selected="true" style="border: none; border-radius: 11px; background: #FFF6D6; box-shadow: 0px 1px 3px rgba(70,40,12,0.16); color: #2B1D0B; font-family: inherit; font-size: 14px; font-weight: 600">Exercises</button>
<button type="button" role="tab" aria-selected="false" style="border: none; border-radius: 11px; background: transparent; color: #614722; font-family: inherit; font-size: 14px; font-weight: 500">Workouts</button>
</div>

<section style="padding: 16px; border-radius: 20px; background: rgba(255,246,214,0.8); box-shadow: inset 0px 1px 0px rgba(255,255,255,0.95), inset 0px 0px 0px 0.5px rgba(255,255,255,0.6), 0px 10px 30px -12px rgba(70,40,12,0.16); display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: flex-start; gap: 8px">
<div style="flex-grow: 1">
<h2 style="margin: 0; font-size: 16px; line-height: 21px; font-weight: 600">Bench Press</h2>
<div style="font-size: 13px; line-height: 18px; color: #614722">Best set each week · last 12 weeks</div>
</div>
<button type="button" aria-label="Choose exercise" style="width: 44px; height: 44px; border-radius: 22px; border: none; padding: 0; background: rgba(97,71,34,0.06); color: #2B1D0B; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 22px; line-height: 26px; font-weight: 600; letter-spacing: -0.4px; font-variant-numeric: tabular-nums">62.5 kg × 5</span>
<span style="height: 24px; padding: 0px 8px; border-radius: 12px; background: #FFE2A0; color: #5C3A08; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>PR this week
</span>
</div>
<svg width="326" height="146" viewBox="0 0 326 146" role="img" aria-label="Bench press best set rose from 50 kg to 62.5 kg over the last 12 weeks">
<line x1="30" x2="316" y1="92.5" y2="92.5" stroke="#D7C27E" stroke-width="1"></line>
<line x1="30" x2="316" y1="65" y2="65" stroke="#D7C27E" stroke-width="1"></line>
<line x1="30" x2="316" y1="37.5" y2="37.5" stroke="#D7C27E" stroke-width="1"></line>
<line x1="30" x2="316" y1="120" y2="120" stroke="#C9B06E" stroke-width="1"></line>
<text x="22" y="96" text-anchor="end" font-size="11" fill="#7A5E3A" font-family="Inter, system-ui, sans-serif">50</text>
<text x="22" y="68.5" text-anchor="end" font-size="11" fill="#7A5E3A" font-family="Inter, system-ui, sans-serif">55</text>
<text x="22" y="41" text-anchor="end" font-size="11" fill="#7A5E3A" font-family="Inter, system-ui, sans-serif">60</text>
<polygon points="30,92.5 55.1,78.75 80.2,78.75 105.3,65 130.4,65 155.5,65 180.5,51.25 205.6,51.25 230.7,37.5 255.8,37.5 280.9,37.5 306,23.75 306,120 30,120" fill="rgba(255,209,121,0.35)"></polygon>
<polyline points="30,92.5 55.1,78.75 80.2,78.75 105.3,65 130.4,65 155.5,65 180.5,51.25 205.6,51.25 230.7,37.5 255.8,37.5 280.9,37.5 306,23.75" fill="none" stroke="#9A6414" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
<circle cx="306" cy="23.75" r="5" fill="#9A6414" stroke="#FFF6D6" stroke-width="2"></circle>
<text x="296" y="14" text-anchor="end" font-size="11" font-weight="600" fill="#2B1D0B" font-family="Inter, system-ui, sans-serif">62.5 kg</text>
<text x="30" y="140" text-anchor="middle" font-size="11" fill="#7A5E3A" font-family="Inter, system-ui, sans-serif">Jul</text>
<text x="105.3" y="140" text-anchor="middle" font-size="11" fill="#7A5E3A" font-family="Inter, system-ui, sans-serif">Aug</text>
<text x="230.7" y="140" text-anchor="middle" font-size="11" fill="#7A5E3A" font-family="Inter, system-ui, sans-serif">Sep</text>
</svg>
<button type="button" style="align-self: flex-start; height: 44px; margin: -6px 0px -8px -4px; padding: 0px 4px; border: none; background: transparent; color: #7A4A12; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg>Show as table
</button>
</section>

<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 16px; line-height: 21px; font-weight: 600">All exercises</h2>
<sc-for list="{{exercises}}" as="e" hint-placeholder-count="4">
<button type="button" style="width: 100%; min-height: 64px; box-sizing: border-box; padding: 10px 12px 10px 16px; border: none; border-radius: 20px; background: rgba(255,246,214,0.8); box-shadow: inset 0px 1px 0px rgba(255,255,255,0.95), 0px 10px 30px -12px rgba(70,40,12,0.16); color: #2B1D0B; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 12px">
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; line-height: 21px; font-weight: 600">{{e.name}}</span>
<span style="display: flex; align-items: center; gap: 5px; font-size: 13px; line-height: 18px; color: #614722">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9A6414" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>PR {{e.pr}}
</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
<svg width="64" height="28" viewBox="0 0 64 28" aria-hidden="true"><polyline points="{{e.points}}" fill="none" stroke="#9A6414" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline><circle cx="{{e.endX}}" cy="{{e.endY}}" r="3" fill="#9A6414"></circle></svg>
<span style="display: flex; align-items: center; gap: 3px; font-size: 12px; line-height: 16px; font-weight: 600; color: #3E5E12">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg>{{e.change}}
</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A5E3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
</button>
</sc-for>
</section>
</main>
<div style="position: absolute; left: 0px; bottom: 0px; width: 390px; height: 104px">
<dc-import name="TabBar" active="progress" hint-size="390px,104px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const spark = (values) => {
      const min = Math.min.apply(null, values);
      const max = Math.max.apply(null, values);
      const span = max - min || 1;
      const pts = values.map((v, i) => ({
        x: 4 + i * (56 / (values.length - 1)),
        y: 24 - ((v - min) / span) * 20,
      }));
      const last = pts[pts.length - 1];
      return {
        points: pts.map((p) => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' '),
        endX: last.x.toFixed(1),
        endY: last.y.toFixed(1),
      };
    };
    const row = (name, pr, change, values) => Object.assign({ name: name, pr: pr, change: change }, spark(values));
    return {
      exercises: [
        row('Squat', '100 kg × 5', '+7.5 kg', [92.5, 92.5, 95, 95, 95, 97.5, 97.5, 97.5, 100, 100, 100, 100]),
        row('Deadlift', '140 kg × 3', '+10 kg', [130, 130, 132.5, 132.5, 135, 135, 135, 137.5, 137.5, 140, 140, 140]),
        row('Pull-up', '12 reps', '+3 reps', [9, 9, 10, 10, 10, 10, 11, 11, 11, 12, 12, 12]),
        row('Plank', '1:15 hold', '+20 s', [55, 55, 60, 60, 60, 65, 65, 70, 70, 70, 75, 75]),
      ],
    };
  }
}
</script>
</body>
</html>
